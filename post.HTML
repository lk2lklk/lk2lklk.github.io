<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>发表留言</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  form {
    margin: 1.5rem 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  textarea {
    padding: 0.8rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 16px;
    font-family: inherit;
  }
  button {
    padding: 0.8rem;
    background: #0070f3;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
  }
  button:hover {
    background: #005bb5;
  }
  .nav {
    margin-bottom: 1rem;
  }
  .nav a {
    color: #0070f3;
    text-decoration: none;
  }
  .note {
    background: #f9f9f9;
    padding: 0.8rem;
    border-radius: 6px;
    margin-bottom: 1rem;
    font-size: 14px;
    color: #555;
  }
</style>
</head>
<body>
<div class="nav"><a href="index.html">← 返回目录</a></div>

<h1>发表新留言</h1>

<form id="form">
  <textarea id="content" rows="10" placeholder="" required></textarea>
  <button type="submit">提交留言</button>
</form>

<script>
  const SUPABASE_URL = "https://tchjirsxgoixavmwqjzj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_WBeruDi1g2uFhM--n0dmUg_f_HXztPe";
  const TABLE = "myboxs";

  document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();
    const text = document.getElementById("content").value.trim();
    if (!text) return;

    let lines = text.split(/\r?\n/);
    let name = lines[0].trim();
    let content = lines.slice(1).join("\n").trim();
    if (!content) content = "无留言内容";

    await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ name, content })
    });

    alert("留言已提交！");
    window.location.href = "index.html";
  });
</script>
</body>
</html>
