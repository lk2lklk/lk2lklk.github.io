<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>文字记录本 · 轻灵笔记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e9eef4 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        /* 优雅主容器 */
        .elegant-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 主卡片 */
        .master-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* 头部区域 */
        .card-header {
            padding: 1.8rem 2rem 1.2rem 2rem;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1rem;
            background: #ffffff;
        }

        .title-section h1 {
            font-size: 1.85rem;
            font-weight: 620;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #1e2c3a, #2c3e50);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .title-section h1:before {
            content: "📋";
            background: none;
            font-size: 1.8rem;
            color: #2c6e9e;
        }

        .new-record-btn {
            background: linear-gradient(105deg, #2c6e9e 0%, #1f4e72 100%);
            color: white;
            padding: 0.65rem 1.6rem;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        .new-record-btn:hover {
            background: linear-gradient(105deg, #1f5a85, #13425f);
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -12px rgba(31, 90, 133, 0.4);
        }

        /* 统计栏 */
        .stats-bar {
            background: #f9fbfe;
            padding: 0.9rem 2rem;
            border-bottom: 1px solid #eef2f8;
            font-size: 0.85rem;
            color: #3a546d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .count-badge {
            background: #eef2fa;
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.8rem;
            color: #1e4663;
        }

        /* 优雅文字卡片列表 */
        .entries-area {
            padding: 1.2rem 1.8rem 2rem 1.8rem;
            background: #ffffff;
        }

        .title-item {
            background: #ffffff;
            margin-bottom: 0.85rem;
            border-radius: 1.2rem;
            transition: all 0.2s ease;
            border: 1px solid #edf2f9;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .title-item:hover {
            border-color: #d4e2f5;
            background: #fefefe;
            transform: translateX(3px);
            box-shadow: 0 12px 22px -14px rgba(0, 0, 0, 0.1);
        }

        .entry-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 1rem 1.4rem;
            text-decoration: none;
            color: #1c2f40;
            transition: background 0.15s;
            cursor: pointer;
        }

        .entry-icon {
            width: 28px;
            height: 28px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%233b7c9e" width="28px" height="28px"><path d="M4 4h16v2H4V4zm2 4h12v2H6V8zm14-4v16H4V4h2v14h12V4h2zM6 12h12v2H6v-2zm0 4h12v2H6v-2z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            flex-shrink: 0;
            transition: transform 0.15s;
        }

        .title-item:hover .entry-icon {
            transform: scale(1.02);
        }

        .title-text {
            flex: 1;
            font-size: 1.04rem;
            font-weight: 520;
            letter-spacing: -0.2px;
            color: #1f3e55;
            line-height: 1.4;
            word-break: break-word;
        }

        .entry-link:hover .title-text {
            color: #1f6e9c;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .light-time {
            font-size: 0.7rem;
            color: #9aaebf;
            background: #f5f9fe;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            white-space: nowrap;
            font-weight: 400;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 3.5rem 1.5rem;
            background: #fefefe;
            border-radius: 2rem;
            color: #8ca3bb;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.7;
        }

        .empty-state a {
            color: #2c6e9e;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px dashed #bdd4ec;
            cursor: pointer;
        }

        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: #8ca0b5;
        }

        /* 模态框 (新增记录用) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal-card {
            background: white;
            max-width: 680px;
            width: 90%;
            border-radius: 2rem;
            box-shadow: 0 25px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: fadeUp 0.2s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .modal-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }
        .modal-header h3 {
            font-weight: 600;
            color: #1e2c3a;
        }
        .close-modal {
            font-size: 1.6rem;
            cursor: pointer;
            line-height: 1;
            color: #8ca3bb;
        }
        .modal-body {
            padding: 1.8rem;
        }
        .modal-body textarea {
            width: 100%;
            border: 1px solid #cbd5e6;
            border-radius: 1.2rem;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 220px;
        }
        .modal-footer {
            padding: 1rem 1.8rem 1.8rem;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .btn-modal {
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background: #2c6e9e;
            color: white;
        }
        .btn-secondary {
            background: #eef2fa;
            color: #2c3e50;
        }
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 2100;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        @media (max-width: 640px) {
            body { padding: 1rem; }
            .card-header { padding: 1.2rem 1.2rem 1rem; flex-direction: column; align-items: flex-start; }
            .entries-area { padding: 1rem; }
            .entry-link { padding: 0.75rem 1rem; gap: 10px; }
            .light-time { font-size: 0.65rem; white-space: nowrap; }
            .title-text { font-size: 0.94rem; }
        }
    </style>
</head>
<body>
<div class="elegant-container">
    <div class="master-card">
        <div class="card-header">
            <div class="title-section">
                <h1>✨ 简单信息储存 · 灵境笔记</h1>
            </div>
            <div class="new-record-btn" id="openModalBtn">
                <span>✚</span> 新建记录
            </div>
        </div>

        <div class="stats-bar">
            <div class="count-badge" id="totalCountBadge">
                📌 共 <strong id="totalNumber">0</strong> 条记录
            </div>
            <div class="filter-note">
                🪶 点击条目查看完整内容
            </div>
        </div>

        <div class="entries-area" id="entriesList">
            <div class="empty-state">
                <div class="empty-icon">📭</div>
                <div style="font-size: 1rem; margin-bottom: 0.5rem;">暂未发现记录</div>
                <div>书写第一段思绪 → <span id="emptyCreateBtn" style="cursor:pointer; color:#2c6e9e; font-weight:500;">开始创作</span></div>
            </div>
        </div>
    </div>
    <div class="footer-note">
        专注阅读 | 数据储存在浏览器中，永久留存
    </div>
</div>

<!-- 新建/编辑通用模态框 -->
<div id="recordModal" class="modal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle">📝 新建记录</h3>
            <span class="close-modal" id="closeModalBtn">&times;</span>
        </div>
        <div class="modal-body">
            <textarea id="modalContent" placeholder="写下任何文字、灵感、待办事项 ...&#10;支持多行文本，自动保存至本地存储"></textarea>
        </div>
        <div class="modal-footer">
            <button class="btn-modal btn-secondary" id="cancelModalBtn">取消</button>
            <button class="btn-modal btn-primary" id="confirmSaveBtn">💾 保存记录</button>
        </div>
    </div>
</div>

<!-- 详情模态框 (查看完整内容) -->
<div id="detailModal" class="modal">
    <div class="modal-card" style="max-width: 720px;">
        <div class="modal-header">
            <h3>📄 完整记录</h3>
            <span class="close-modal" id="closeDetailBtn">&times;</span>
        </div>
        <div class="modal-body" id="detailBody">
            <div style="margin-bottom: 12px; color:#6c86a3; font-size:0.8rem;" id="detailTime"></div>
            <div style="white-space: pre-wrap; line-height:1.6; font-size:1rem;" id="detailText"></div>
        </div>
        <div class="modal-footer" style="justify-content: space-between;">
            <div>
                <button class="btn-modal btn-secondary" id="deleteFromDetailBtn">🗑️ 删除此条</button>
            </div>
            <div>
                <button class="btn-modal btn-secondary" id="editFromDetailBtn">✏️ 编辑</button>
                <button class="btn-modal btn-primary" id="closeDetailOnlyBtn">关闭</button>
            </div>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script>
    // ---------- 存储KEY与全局数据结构 ----------
    const STORAGE_KEY = 'text_records_app_enhanced';
    
    // 辅助函数：显示toast消息
    function showToast(message, duration = 2000) {
        const toast = document.getElementById('toastMsg');
        if (!toast) return;
        toast.textContent = message;
        toast.style.opacity = '1';
        setTimeout(() => {
            toast.style.opacity = '0';
        }, duration);
    }

    // 获取所有记录 (最新在前)
    function getAllRecords() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        try {
            let records = JSON.parse(raw);
            if (!Array.isArray(records)) return [];
            records = records.filter(r => r && typeof r.text === 'string' && r.id);
            records.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
            return records;
        } catch(e) {
            console.warn(e);
            return [];
        }
    }

    // 保存全部记录
    function saveAllRecords(records) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        renderHomeList();          // 刷新主界面
        // 触发storage事件 (同源其他标签页可同步)
        window.dispatchEvent(new Event('storage'));
    }

    // 添加或更新记录 (若id存在则更新，否则新增)
    function upsertRecord(id, text) {
        if (!text || text.trim() === '') {
            showToast('❌ 内容不能为空', 1200);
            return false;
        }
        const trimmedText = text.trim();
        let records = getAllRecords();
        const now = Date.now();
        const dateStr = new Date(now).toLocaleString('zh-CN');
        
        if (id) {
            // 编辑模式：查找并更新
            const index = records.findIndex(r => r.id == id);
            if (index !== -1) {
                records[index].text = trimmedText;
                records[index].timestamp = now;
                records[index].dateStr = dateStr;
                // 重新排序 (更新时间戳)
                records.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                saveAllRecords(records);
                showToast('✏️ 记录已更新', 1300);
                return true;
            } else {
                showToast('记录不存在，将创建新记录', 1000);
                // fallback 创建新记录
            }
        }
        // 新增记录
        const newRecord = {
            id: Date.now() + '-' + Math.random().toString(36).substr(2, 8),
            text: trimmedText,
            timestamp: now,
            dateStr: dateStr
        };
        records.unshift(newRecord);
        saveAllRecords(records);
        showToast('✅ 记录已保存', 1200);
        return true;
    }

    // 删除单条记录
    function deleteRecordById(id) {
        if (!id) return false;
        let records = getAllRecords();
        const newRecords = records.filter(r => r.id != id);
        if (newRecords.length === records.length) {
            showToast('记录不存在', 1000);
            return false;
        }
        saveAllRecords(newRecords);
        showToast('🗑️ 已删除记录', 1200);
        return true;
    }

    // 生成纯净标题 (取前50字符)
    function smartTitle(text) {
        if (!text) return '未命名记录';
        let clean = text.replace(/\n/g, ' ').trim();
        if (clean.length <= 55) return clean;
        return clean.substring(0, 52) + '...';
    }

    // 渲染主界面列表（类似 index.asp 风格）
    function renderHomeList() {
        const container = document.getElementById('entriesList');
        const totalSpan = document.getElementById('totalNumber');
        if (!container) return;
        
        const records = getAllRecords();
        const totalCount = records.length;
        if (totalSpan) totalSpan.innerText = totalCount;
        
        if (records.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div style="font-size: 1rem; margin-bottom: 0.5rem;">暂未发现记录</div>
                    <div>书写第一段思绪 → <span id="emptyCreateBtn" style="cursor:pointer; color:#2c6e9e; font-weight:500;">开始创作</span></div>
                </div>
            `;
            const emptyBtn = document.getElementById('emptyCreateBtn');
            if (emptyBtn) emptyBtn.addEventListener('click', () => openModal(null));
            return;
        }
        
        let html = '';
        records.forEach(record => {
            const displayTitle = smartTitle(record.text);
            const formattedTime = record.dateStr || new Date(record.timestamp).toLocaleString('zh-CN');
            const shortIdShort = String(record.id).slice(-6);
            html += `
                <div class="title-item" data-id="${record.id}">
                    <div class="entry-link" data-id="${record.id}">
                        <div class="entry-icon"></div>
                        <span class="title-text">${escapeHtml(displayTitle)}</span>
                        <span class="light-time">🕒 ${escapeHtml(formattedTime)}</span>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        
        // 绑定条目点击事件 (查看详情)
        document.querySelectorAll('.entry-link').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = el.getAttribute('data-id');
                if (id) showDetailById(id);
            });
        });
    }
    
    // 显示详情模态框 (类似 view 页)
    function showDetailById(id) {
        const records = getAllRecords();
        const record = records.find(r => r.id == id);
        if (!record) {
            showToast('记录不存在', 1000);
            return;
        }
        const detailTimeSpan = document.getElementById('detailTime');
        const detailTextDiv = document.getElementById('detailText');
        if (detailTimeSpan) detailTimeSpan.innerHTML = `📅 ${escapeHtml(record.dateStr || new Date(record.timestamp).toLocaleString())} &nbsp;| 🆔 ${escapeHtml(String(record.id).slice(-8))}`;
        if (detailTextDiv) detailTextDiv.innerText = record.text;
        
        // 存储当前查看的id用于删除/编辑
        const detailModal = document.getElementById('detailModal');
        detailModal.setAttribute('data-current-id', record.id);
        detailModal.style.display = 'flex';
    }
    
    // 关闭详情模态框
    function closeDetailModal() {
        const modal = document.getElementById('detailModal');
        if (modal) modal.style.display = 'none';
    }
    
    // 打开新建/编辑模态框 (edit模式时传入record)
    let currentEditId = null;
    function openModal(record = null) {
        const modal = document.getElementById('recordModal');
        const textarea = document.getElementById('modalContent');
        const modalTitle = document.getElementById('modalTitle');
        if (!modal) return;
        if (record) {
            // 编辑模式
            currentEditId = record.id;
            modalTitle.innerText = '✏️ 编辑记录';
            textarea.value = record.text;
        } else {
            currentEditId = null;
            modalTitle.innerText = '📝 新建记录';
            textarea.value = '';
        }
        modal.style.display = 'flex';
        textarea.focus();
    }
    
    function closeModal() {
        const modal = document.getElementById('recordModal');
        if (modal) modal.style.display = 'none';
        currentEditId = null;
    }
    
    // 保存模态框内容
    function saveFromModal() {
        const textarea = document.getElementById('modalContent');
        const content = textarea.value;
        if (!content.trim()) {
            showToast('❌ 内容不能为空', 1200);
            return;
        }
        const success = upsertRecord(currentEditId, content);
        if (success) {
            closeModal();
            renderHomeList();
        }
    }
    
    // 从详情中删除
    function deleteFromDetail() {
        const detailModal = document.getElementById('detailModal');
        const id = detailModal.getAttribute('data-current-id');
        if (!id) return;
        if (confirm('确定要永久删除这条记录吗？')) {
            deleteRecordById(id);
            closeDetailModal();
            renderHomeList();
        }
    }
    
    // 从详情中编辑
    function editFromDetail() {
        const detailModal = document.getElementById('detailModal');
        const id = detailModal.getAttribute('data-current-id');
        if (!id) return;
        const records = getAllRecords();
        const record = records.find(r => r.id == id);
        if (record) {
            closeDetailModal();
            openModal(record);
        } else {
            showToast('加载记录失败', 1000);
        }
    }
    
    // 清空全部记录 (参考原delete风格但加确认)
    function clearAllRecords() {
        if (confirm('⚠️ 警告：将删除 【所有记录】 且无法恢复！确定清空？')) {
            localStorage.removeItem(STORAGE_KEY);
            renderHomeList();
            showToast('🗑️ 已清空所有记录', 1500);
        }
    }
    
    // 辅助escape
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, c => c);
    }
    
    // 监听storage同步 (多标签页)
    function bindCrossTabSync() {
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
                renderHomeList();
                showToast('🔄 检测到其他页面更新', 1000);
            }
        });
    }
    
    // 初始化所有事件
    function initApp() {
        renderHomeList();
        bindCrossTabSync();
        
        // 新建按钮打开空模态
        const openBtn = document.getElementById('openModalBtn');
        if (openBtn) openBtn.addEventListener('click', () => openModal(null));
        
        // 模态框关闭按钮
        const closeBtn = document.getElementById('closeModalBtn');
        const cancelBtn = document.getElementById('cancelModalBtn');
        if (closeBtn) closeBtn.addEventListener('click', closeModal);
        if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
        
        // 保存按钮
        const confirmBtn = document.getElementById('confirmSaveBtn');
        if (confirmBtn) confirmBtn.addEventListener('click', saveFromModal);
        
        // 详情模态框关闭
        const closeDetail = document.getElementById('closeDetailBtn');
        const closeDetailOnly = document.getElementById('closeDetailOnlyBtn');
        if (closeDetail) closeDetail.addEventListener('click', closeDetailModal);
        if (closeDetailOnly) closeDetailOnly.addEventListener('click', closeDetailModal);
        
        // 详情中的删除和编辑
        const deleteDetail = document.getElementById('deleteFromDetailBtn');
        const editDetail = document.getElementById('editFromDetailBtn');
        if (deleteDetail) deleteDetail.addEventListener('click', deleteFromDetail);
        if (editDetail) editDetail.addEventListener('click', editFromDetail);
        
        // 点击模态框背景关闭
        window.addEventListener('click', (e) => {
            const modalElem = document.getElementById('recordModal');
            const detailElem = document.getElementById('detailModal');
            if (e.target === modalElem) closeModal();
            if (e.target === detailElem) closeDetailModal();
        });
        
        // 可选添加快捷键 Ctrl+N 新建记录
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                openModal(null);
            }
            // ESC关闭模态框
            if (e.key === 'Escape') {
                closeModal();
                closeDetailModal();
            }
        });
        
        // 全局也提供一个清除所有功能 (但为了避免页面冗余，加一个隐藏的? 参考原delete.asp但保留温和，在控制台提供快捷？为了完整性，增加右下角悬浮清除？不，尊重设计: 但在主界面不需要清空全部按钮，但为了参考原系统可以提供一个管理方式: 用浏览器开发者工具手动，但是用户若有需求可以加；在统计栏附近增加一个“管理”下拉? 为了优雅，增加一个小工具在统计栏右侧
        const statsBar = document.querySelector('.stats-bar');
        if (statsBar && !document.getElementById('clearAllUtility')) {
            const clearBtnSpan = document.createElement('div');
            clearBtnSpan.style.cursor = 'pointer';
            clearBtnSpan.style.fontSize = '0.7rem';
            clearBtnSpan.style.background = '#ffe8e6';
            clearBtnSpan.style.padding = '2px 10px';
            clearBtnSpan.style.borderRadius = '60px';
            clearBtnSpan.style.color = '#b91c1c';
            clearBtnSpan.innerText = '🗑️ 清空全部';
            clearBtnSpan.id = 'clearAllUtility';
            clearBtnSpan.addEventListener('click', clearAllRecords);
            statsBar.appendChild(clearBtnSpan);
        }
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
    } else {
        initApp();
    }
</script>
</body>
</html>
