<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>所有记录 · 灵境笔记墙</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title-section">
            <h1>📖 灵境 · 卡片墙</h1>
            <p>所有保存的文字｜流光卡片，一览无余</p>
        </div>
        <div class="stats-badge">
            <span>📚 总计</span>
            <span class="count-number" id="totalCountDisplay">0</span>
            <span>条灵思</span>
        </div>
        <div class="actions">
            <button class="btn btn-primary" id="refreshViewBtn">🔄 刷新同步</button>
            <button class="btn btn-outline" id="gotoIndexBtn">✍️ 新建记录</button>
            <button class="btn btn-danger-light" id="clearAllFromViewBtn">🗑️ 清空全部</button>
        </div>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="搜索文字内容 (标题/全文)...">
        </div>
        <div class="sort-buttons">
            <button class="sort-btn active" data-sort="newest">🕒 最新优先</button>
            <button class="sort-btn" data-sort="oldest">⏳ 最早优先</button>
        </div>
    </div>

    <!-- 记录卡片网格 -->
    <div id="recordsContainer" class="records-grid">
        <div class="empty-state">
            <h3>✨ 暂未发现记录</h3>
            <p>前往「灵境笔记」主页，写下第一条思绪吧~</p>
            <button id="emptyStateCreateBtn" style="margin-top: 20px;" class="btn btn-primary">➕ 创建新记录</button>
        </div>
    </div>
    <footer>
        💡 数据存储于 localStorage · 与主页实时同步 · 点击卡片下方按钮复制全文/ID
    </footer>
</div>
<div id="toastMsg" class="toast-msg"></div>
<button class="scroll-top" id="scrollTopBtn" aria-label="返回顶部">↑</button>

<script>
    // 存储KEY必须与 index.html 完全一致
    const STORAGE_KEY = 'text_records_app';
    
    // 当前排序与搜索状态
    let currentSort = 'newest';     // 'newest' or 'oldest'
    let currentSearchTerm = '';
    
    // ---------- 辅助函数 ----------
    function showToast(message, duration = 2000) {
        const toast = document.getElementById('toastMsg');
        if (!toast) return;
        toast.textContent = message;
        toast.style.opacity = '1';
        setTimeout(() => {
            toast.style.opacity = '0';
        }, duration);
    }
    
    // 获取原始记录（不做任何过滤/排序）
    function getRawRecords() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        try {
            let records = JSON.parse(raw);
            if (!Array.isArray(records)) return [];
            // 基本数据有效性过滤
            records = records.filter(r => r && typeof r.text === 'string' && r.id && r.timestamp);
            return records;
        } catch(e) {
            console.warn(e);
            return [];
        }
    }
    
    // 获取经过搜索和排序的记录（用于渲染）
    function getFilteredAndSortedRecords() {
        let records = getRawRecords();
        // 1. 搜索过滤 (内容包含关键词)
        if (currentSearchTerm.trim() !== '') {
            const lowerSearch = currentSearchTerm.trim().toLowerCase();
            records = records.filter(rec => rec.text.toLowerCase().includes(lowerSearch));
        }
        // 2. 排序
        if (currentSort === 'newest') {
            records.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        } else {
            records.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
        }
        return records;
    }
    
    // 格式化时间：优先使用存储的 dateStr，否则根据时间戳生成友好时间
    function formatDate(timestamp, dateStrFallback) {
        if (dateStrFallback && typeof dateStrFallback === 'string' && dateStrFallback.trim() !== '') {
            return dateStrFallback;
        }
        if (!timestamp) return '未知时间';
        const date = new Date(timestamp);
        // 避免无效时间
        if (isNaN(date.getTime())) return '时间错';
        const year = date.getFullYear();
        const month = (date.getMonth() + 1).toString().padStart(2, '0');
        const day = date.getDate().toString().padStart(2, '0');
        const hours = date.getHours().toString().padStart(2, '0');
        const minutes = date.getMinutes().toString().padStart(2, '0');
        const seconds = date.getSeconds().toString().padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }
    
    // 简易防XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, (c) => c);
    }
    
    // 复制到剪贴板 (兼容)
    function copyToClipboard(text, successMsg = '已复制') {
        if (!text) return;
        const finalText = typeof text === 'string' ? text : String(text);
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(finalText).then(() => {
                showToast(`📋 ${successMsg}`, 1300);
            }).catch(() => {
                fallbackCopy(finalText, successMsg);
            });
        } else {
            fallbackCopy(finalText, successMsg);
        }
    }
    
    function fallbackCopy(text, successMsg) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast(`📋 ${successMsg}`, 1200);
    }
    
    // 删除单条记录
    function deleteRecordById(id) {
        if (!id) return;
        let records = getRawRecords();
        const newRecords = records.filter(r => String(r.id) !== String(id));
        if (newRecords.length === records.length) {
            showToast('记录不存在或已被删除', 1000);
            return;
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(newRecords));
        // 重新渲染视图
        renderRecords();
        // 触发全局存储事件，让同源页面（如index.html）同步
        window.dispatchEvent(new StorageEvent('storage', { key: STORAGE_KEY, newValue: JSON.stringify(newRecords) }));
        showToast('✅ 已删除一条笔记', 1200);
    }
    
    // 清空全部记录 (二次确认)
    function clearAllRecords() {
        if (confirm('⚠️ 永久删除所有笔记，此操作不可恢复！确定要清空全部记录吗？')) {
            localStorage.removeItem(STORAGE_KEY);
            renderRecords();
            showToast('🗑️ 所有记录已清空', 1600);
            window.dispatchEvent(new StorageEvent('storage', { key: STORAGE_KEY, newValue: null }));
        }
    }
    
    // 核心渲染：生成卡片墙
    function renderRecords() {
        const container = document.getElementById('recordsContainer');
        const totalSpan = document.getElementById('totalCountDisplay');
        if (!container) return;
        
        // 原始总数（未被搜索过滤）
        const totalRawCount = getRawRecords().length;
        if (totalSpan) totalSpan.innerText = totalRawCount;
        
        const records = getFilteredAndSortedRecords();
        
        // 空状态处理 (无匹配记录或完全无数据)
        if (records.length === 0) {
            let emptyHtml = `<div class="empty-state">
                <div style="font-size: 3rem; margin-bottom: 12px;">📭</div>
                <h3>✨ 暂无记录</h3>`;
            if (currentSearchTerm.trim() !== '') {
                emptyHtml += `<p>没有找到包含 “${escapeHtml(currentSearchTerm)}” 的笔记，试试其他关键词吧 🕊️</p>`;
            } else {
                emptyHtml += `<p>还没有任何文字记录，点击下方按钮或前往主页书写第一段灵感 ✍️</p>`;
            }
            emptyHtml += `<button id="emptyStateCreateBtn" style="margin-top: 22px;" class="btn btn-primary">➕ 创建新记录</button>
                        </div>`;
            container.innerHTML = emptyHtml;
            const emptyBtn = document.getElementById('emptyStateCreateBtn');
            if (emptyBtn) {
                emptyBtn.addEventListener('click', () => {
                    window.location.href = 'index.html';
                });
            }
            return;
        }
        
        // 生成卡片HTML
        let cardsHtml = '';
        for (const record of records) {
            const displayDate = formatDate(record.timestamp, record.dateStr);
            const shortId = String(record.id).slice(-8);
            const cardContentRaw = record.text || '';
            // 避免过长卡片样式影响体验，保留完整文本，但使用 max-height 滚动
            cardsHtml += `
                <div class="record-card" data-record-id="${record.id}">
                    <div class="card-header">
                        <div class="timestamp">📅 ${escapeHtml(displayDate)}</div>
                        <div class="card-actions">
                            <button class="icon-btn copy-id-btn" title="复制卡片ID" data-id="${record.id}" data-type="id">🔗</button>
                            <button class="icon-btn delete-btn" title="删除这条笔记" data-id="${record.id}">🗑️</button>
                        </div>
                    </div>
                    <div class="card-content">${escapeHtml(cardContentRaw)}</div>
                    <div class="card-footer">
                        <span>🆔 #${escapeHtml(shortId)}</span>
                        <span class="copy-id" data-id="${record.id}" data-type="fulltext" style="cursor:pointer;">📋 复制全文</span>
                    </div>
                </div>
            `;
        }
        container.innerHTML = cardsHtml;
        
        // ----- 绑定所有卡片内按钮事件 (使用事件委托也可，但直接绑更清晰) -----
        // 删除按钮
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                if (id && confirm('确定删除这条记录吗？')) {
                    deleteRecordById(id);
                } else if (id) {
                    // 用户取消，不做操作
                }
            });
        });
        
        // 复制ID按钮
        document.querySelectorAll('.copy-id-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                if (id) {
                    copyToClipboard(id, '记录ID已复制');
                }
            });
        });
        
        // 复制全文 (卡片底部)
        document.querySelectorAll('.copy-id').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = el.getAttribute('data-id');
                if (id) {
                    const record = getRawRecords().find(r => String(r.id) === String(id));
                    if (record && record.text) {
                        copyToClipboard(record.text, '全文已复制到剪贴板');
                    } else {
                        showToast('未找到文本内容', 1000);
                    }
                }
            });
        });
    }
    
    // 刷新视图 (强制重新拉取数据)
    function refreshView() {
        renderRecords();
        showToast('🔄 已同步最新笔记', 1100);
    }
    
    // 跨标签页同步: 监听storage事件，确保index.html或本页面其他标签修改后自动刷新
    function bindCrossTabSync() {
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
                // 数据变化，重新渲染
                renderRecords();
                showToast('📡 检测到内容更新，已自动刷新', 1300);
            }
        });
    }
    
    // 初始化页面及交互
    function initViewPage() {
        // 首次渲染
        renderRecords();
        bindCrossTabSync();
        
        // 搜索框
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                currentSearchTerm = e.target.value;
                renderRecords();
            });
        }
        
        // 排序按钮
        const sortBtns = document.querySelectorAll('.sort-btn');
        sortBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const sortVal = btn.getAttribute('data-sort');
                if (sortVal === 'newest') {
                    currentSort = 'newest';
                } else if (sortVal === 'oldest') {
                    currentSort = 'oldest';
                }
                // 更新按钮激活样式
                sortBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderRecords();
            });
        });
        
        // 刷新按钮
        const refreshBtn = document.getElementById('refreshViewBtn');
        if (refreshBtn) refreshBtn.addEventListener('click', refreshView);
        
        // 跳转到主页（新建记录）
        const gotoIndexBtn = document.getElementById('gotoIndexBtn');
        if (gotoIndexBtn) gotoIndexBtn.addEventListener('click', () => {
            window.location.href = 'index.html';
        });
        
        // 清空全部按钮
        const clearAllBtn = document.getElementById('clearAllFromViewBtn');
        if (clearAllBtn) clearAllBtn.addEventListener('click', clearAllRecords);
        
        // 返回顶部逻辑 (优雅小功能)
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        if (scrollTopBtn) {
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    scrollTopBtn.classList.add('show');
                } else {
                    scrollTopBtn.classList.remove('show');
                }
            });
            scrollTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
        
        // 若当前空状态里的创建按钮将来可能被动态重新生成，已经在render里处理，但额外监听一下以防全局备用
        // 无需额外操作
    }
    
    // 启动
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initViewPage);
    } else {
        initViewPage();
    }
</script>
</body>
</html>
