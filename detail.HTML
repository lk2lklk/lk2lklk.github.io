<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>留言详情</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  .detail-card {
    border: 1px solid #ddd;
    padding: 1.5rem;
    border-radius: 8px;
    background: #fafafa;
  }
  .name {
    font-size: 1.3rem;
    font-weight: bold;
    margin-bottom: 0.5rem;
  }
  .time {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 1.5rem;
  }
  .content {
    font-size: 1rem;
    line-height: 1.5;
    white-space: pre-wrap;
    background: white;
    padding: 1rem;
    border-radius: 6px;
    border: 1px solid #eee;
  }
  .nav {
    margin-bottom: 1rem;
  }
  .nav a {
    color: #0070f3;
    text-decoration: none;
  }
  .error {
    color: red;
    text-align: center;
    padding: 2rem;
  }
  .button-group {
    margin-top: 1.5rem;
    display: flex;
    gap: 0.5rem;
  }
  .btn-edit {
    background: #ffc107;
    color: #333;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .btn-delete {
    background: #dc3545;
    color: white;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .btn-save {
    background: #28a745;
    color: white;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .btn-cancel {
    background: #6c757d;
    color: white;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  input, textarea {
    width: 100%;
    padding: 0.5rem;
    font-family: inherit;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
  }
  .edit-name-input {
    font-size: 1.3rem;
    font-weight: bold;
    margin-bottom: 0.5rem;
  }
</style>
</head>
<body>
<div class="nav"><a href="index.html">← 返回目录</a> | <a href="post.html">发表留言</a></div>

<h1>留言详情</h1>
<div id="detail">加载中...</div>

<script>
  const SUPABASE_URL = "https://tchjirsxgoixavmwqjzj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_WBeruDi1g2uFhM--n0dmUg_f_HXztPe";
  const TABLE = "myboxs";

  let currentItem = null; // 保存当前留言数据

  function fmtTime(str) {
    if (!str) return "未知时间";
    const d = new Date(str);
    return d.toLocaleString();
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
      if (m === "&") return "&amp;";
      if (m === "<") return "&lt;";
      if (m === ">") return "&gt;";
      return m;
    });
  }

  // 删除留言
  async function deleteMessage(id) {
    if (!confirm('确定要删除这条留言吗？此操作不可恢复！')) return;
    
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`, {
        method: "DELETE",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        }
      });
      
      if (res.ok) {
        alert('删除成功！');
        window.location.href = "index.html";
      } else {
        const error = await res.text();
        console.error("删除失败:", error);
        alert('删除失败：' + error);
      }
    } catch (err) {
      console.error("删除错误:", err);
      alert('删除失败，请检查网络');
    }
  }

  // 显示编辑界面
  function showEditForm(item) {
    const detailDiv = document.getElementById("detail");
    detailDiv.innerHTML = `
      <div class="detail-card">
        <div class="edit-name-input">
          <label>标题：</label>
          <input type="text" id="editName" value="${escapeHtml(item.name)}">
        </div>
        <div style="margin-top: 1rem;">
          <label>留言内容：</label>
          <textarea id="editContent" rows="10">${escapeHtml(item.content)}</textarea>
        </div>
        <div class="button-group">
          <button class="btn-save" onclick="saveEdit(${item.id})">💾 保存修改</button>
          <button class="btn-cancel" onclick="cancelEdit()">❌ 取消</button>
        </div>
      </div>
    `;
  }

  // 保存编辑
  async function saveEdit(id) {
    const newName = document.getElementById("editName").value.trim();
    const newContent = document.getElementById("editContent").value.trim();
    
    if (!newName) {
      alert('标题不能为空');
      return;
    }
    
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`, {
        method: "PATCH",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ 
          name: newName, 
          content: newContent || "无留言内容" 
        })
      });
      
      if (res.ok) {
        alert('修改成功！');
        loadDetail(); // 重新加载显示最新内容
      } else {
        const error = await res.text();
        console.error("修改失败:", error);
        alert('修改失败：' + error);
      }
    } catch (err) {
      console.error("修改错误:", err);
      alert('修改失败，请检查网络');
    }
  }

  // 取消编辑，重新显示原内容
  function cancelEdit() {
    if (currentItem) {
      displayDetail(currentItem);
    } else {
      loadDetail();
    }
  }

  // 显示留言详情（非编辑模式）
  function displayDetail(item) {
    currentItem = item;
    const detailDiv = document.getElementById("detail");
    detailDiv.innerHTML = `
      <div class="detail-card">
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="time">${fmtTime(item.created_at)}</div>
        <div class="content">${escapeHtml(item.content)}</div>
        <div class="button-group">
          <button class="btn-edit" onclick="showEditForm(currentItem)">✏️ 编辑</button>
          <button class="btn-delete" onclick="deleteMessage(${item.id})">🗑️ 删除</button>
        </div>
      </div>
    `;
  }

  // 加载留言详情
  async function loadDetail() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get("id");

    console.log("获取到的 URL id 参数:", id);

    if (!id) {
      document.getElementById("detail").innerHTML = '<div class="error">❌ 未指定留言ID</div>';
      return;
    }

    try {
      console.log(`正在请求: ${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`);
      
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`, {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        }
      });
      
      console.log("响应状态:", res.status);
      
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      
      const data = await res.json();
      console.log("获取到的数据:", data);

      if (!data || data.length === 0) {
        document.getElementById("detail").innerHTML = '<div class="error">❌ 留言不存在或已被删除</div>';
        return;
      }

      const item = data[0];
      displayDetail(item);
      
    } catch (err) {
      console.error("加载详情错误:", err);
      document.getElementById("detail").innerHTML = `<div class="error">❌ 加载失败：${err.message}<br>请检查网络或控制台</div>`;
    }
  }

  // 页面加载时执行
  loadDetail();
</script>
</body>
</html>
