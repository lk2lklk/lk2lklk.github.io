<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>留言板</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  .msg {
    border: 1px solid #eee;
    padding: 0.8rem;
    margin-bottom: 0.5rem;
    border-radius: 6px;
  }
  .name {
    font-weight: bold;
    margin-bottom: 0.3rem;
  }
  .time {
    font-size: 0.8rem;
    color: #888;
  }
  form {
    margin: 1.5rem 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  textarea {
    padding: 0.8rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 16px;
  }
  button {
    padding: 0.8rem;
    background: #0070f3;
    color: white;
    border: none;
    border-radius: 4.px;
    cursor: pointer;
    font-size: 16px;
  }
</style>
</head>
<body>
<h1>留言板</h1>

<div id="list"></div>

<form id="form">
  <textarea id="content" rows="5" placeholder="第一行作为昵称，下面为留言内容" required></textarea>
  <button type="submit">提交留言</button>
</form>

<script>
  const SUPABASE_URL = "https://tchjirsxgoixavmwqjzj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_WBeruDi1g2uFhM--n0dmUg_f_HXztPe";
  const TABLE = "myboxs";

  function fmtTime(str) {
    const d = new Date(str);
    return d.toLocaleString();
  }

  // 加载留言列表
  async function loadMessages() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?order=created_at.desc`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      }
    });
    const data = await res.json();

    const listEl = document.getElementById("list");
    listEl.innerHTML = "";

    data.forEach(item => {
      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML = `
        <div class="name">${item.name}</div>
        <div>${item.content}</div>
        <div class="time">${fmtTime(item.created_at)}</div>
      `;
      listEl.appendChild(div);
    });
  }

  // 提交：第一行当昵称，剩余当留言
  document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();
    const text = document.getElementById("content").value.trim();
    if (!text) return;

    // 按换行分割
    let lines = text.split(/\r?\n/);
    // 第一行作为昵称
    let name = lines[0].trim();
    // 剩下所有行合并为留言内容
    let content = lines.slice(1).join("\n").trim();

    // 防止只写一行没内容
    if (!content) content = "无留言内容";

    await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ name, content })
    });

    document.getElementById("content").value = "";
    loadMessages();
  });

  loadMessages();
</script>
</body>
</html>
